<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <title>Мій Неоновий Планер</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(21, 28, 44, 0.9);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; touch-action: manipulation; }
    
    header { background: rgba(11, 15, 25, 0.95); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 50; }
    h1 { font-size: 1.15rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 7px 10px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-size: 0.8rem; font-weight: 600; transition: all 0.2s; }
    .icon-btn:active { transform: scale(0.95); background: rgba(99, 102, 241, 0.2); }
    
    select.lang-select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 6px 8px; border-radius: 10px; font-size: 0.8rem; cursor: pointer; outline: none; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; background: rgba(15, 23, 42, 0.6); border-bottom: 1px solid var(--card-border); }
    .week-nav { display: flex; align-items: center; gap: 10px; }
    
    .container { padding: 14px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; transition: transform 0.25s ease, opacity 0.25s ease; }
    
    .day-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 12px; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 130px; }
    .day-card:active { transform: scale(0.97); border-color: var(--primary); }
    .day-card.today { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.2); }
    .day-name { font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); font-weight: 700; }
    .day-date { font-size: 1.2rem; font-weight: 700; margin-top: 2px; }
    
    /* Modal */
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(6px); display: flex; justify-content: center; align-items: flex-end; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content { background: #0f172a; border: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .modal.open .modal-content { transform: translateY(0); }
    
    .modal-header { padding: 16px 18px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: relative; }
    .swipe-indicator { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: absolute; top: 8px; left: 50%; translateX: -50%; }
    
    .hours-scroll { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .hour-row { display: flex; gap: 10px; align-items: center; padding: 8px 10px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }
    .hour-time { font-size: 0.8rem; font-weight: 700; color: var(--text-sub); width: 48px; }
    .hour-input { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 0.9rem; outline: none; }
    
    .btn-ai { background: linear-gradient(135deg, var(--accent-pink), var(--primary)); border: none; color: white; padding: 7px 12px; border-radius: 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 5px; }

    @media (orientation: landscape) {
      .week-grid { grid-template-columns: repeat(7, 1fr); }
      .modal-content { max-height: 95vh; }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="appTitle">Мій Планер</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="togglePomodoro()">⏱️ <span id="pomoLabel">25:00</span></button>
      <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ua">🇺🇦 UA</option>
        <option value="en">🇬🇧 EN</option>
        <option value="ru">🌐 RU</option>
      </select>
    </div>
  </header>

  <div class="nav-bar">
    <div class="week-nav">
      <button class="icon-btn" onclick="changeWeek(-1)">❮</button>
      <span id="currentWeekRange" style="font-weight:700; font-size:0.85rem;"></span>
      <button class="icon-btn" onclick="changeWeek(1)">❯</button>
    </div>
    <span id="monthYearBadge" style="color:var(--accent-cyan); font-weight:600; font-size:0.8rem;"></span>
  </div>

  <div class="container">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- Day View Modal -->
  <div class="modal" id="dayModal" onclick="checkCloseModal(event)">
    <div class="modal-content" id="dayModalContent">
      <div class="swipe-indicator"></div>
      <div class="modal-header">
        <div>
          <h2 id="modalDayTitle" style="font-size:1rem; font-weight:700;"></h2>
          <p id="modalDaySub" style="font-size:0.75rem; color:var(--text-sub);"></p>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-ai" onclick="runAiAnalysis()">✨ Поради ШІ</button>
          <button class="icon-btn" onclick="closeDayModal()">✕</button>
        </div>
      </div>
      <div class="hours-scroll" id="hoursList"></div>
    </div>
  </div>

  <script>
    let currentOffset = 0;
    let selectedDateStr = '';
    let tasks = JSON.parse(localStorage.getItem('planner_tasks_v2') || '{}');
    let pomoInterval = null;
    let pomoSeconds = 1500;
    let isPomoRunning = false;

    const dict = {
      ua: { title: "Мій Планер", free: "Вільний час", aiTip: "✨ ШІ Рада: Сфокусуйтеся на головних завданнях у першій половині дня!" },
      en: { title: "My Planner", free: "Free time", aiTip: "✨ AI Tip: Focus on key tasks during the first half of the day!" },
      ru: { title: "Мой Планер", free: "Свободное время", aiTip: "✨ ИИ Совет: Сфокусируйтесь на главных задачах в первой половине дня!" }
    };
    let currentLang = 'ua';

    function changeLanguage(lang) {
      currentLang = lang;
      document.getElementById('appTitle').innerText = dict[lang].title;
      renderWeek();
    }

    function renderWeek() {
      const grid = document.getElementById('weekGrid');
      grid.innerHTML = '';
      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - now.getDay() + 1 + (currentOffset * 7));

      let monthNames = ['Січень','Лютий','Березень','Квітень','Травень','Червень','Липень','Серпень','Вересень','Жовтень','Листопад','Грудень'];
      document.getElementById('monthYearBadge').innerText = `${monthNames[startOfWeek.getMonth()]} ${startOfWeek.getFullYear()}`;

      let endOfWeek = new Date(startOfWeek);
      endOfWeek.setDate(startOfWeek.getDate() + 6);
      document.getElementById('currentWeekRange').innerText = `${startOfWeek.getDate()} - ${endOfWeek.getDate()} ${monthNames[endOfWeek.getMonth()].toLowerCase()}`;

      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(startOfWeek.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const isToday = d.toDateString() === now.toDateString();

        const dayTasks = tasks[dateStr] || {};
        const count = Object.values(dayTasks.hours || {}).filter(t => t.trim() !== '').length;

        const card = document.createElement('div');
        card.className = `day-card ${isToday ? 'today' : ''}`;
        card.onclick = () => openDayModal(dateStr, d);
        card.innerHTML = `
          <div class="day-name">${d.toLocaleDateString(currentLang === 'ua' ? 'uk-UA' : 'en-US', { weekday: 'short' })}</div>
          <div class="day-date">${d.getDate()}</div>
          <div style="margin-top:auto; font-size:0.75rem; color:var(--accent-cyan);">
            ${count > 0 ? count + ' завдань' : 'Немає завдань'}
          </div>
        `;
        grid.appendChild(card);
      }
    }

    function changeWeek(dir) {
      currentOffset += dir;
      renderWeek();
    }

    function openDayModal(dateStr, dateObj) {
      selectedDateStr = dateStr;
      document.getElementById('modalDayTitle').innerText = dateObj.toLocaleDateString(currentLang === 'ua' ? 'uk-UA' : 'en-US', { weekday: 'long', day: 'numeric', month: 'long' });
      
      const list = document.getElementById('hoursList');
      list.innerHTML = '';

      if (!tasks[dateStr]) tasks[dateStr] = { hours: {} };

      for (let h = 0; h < 24; h++) {
        const hourKey = (h < 10 ? '0' : '') + h + ':00';
        const row = document.createElement('div');
        row.className = 'hour-row';
        row.innerHTML = `
          <div class="hour-time">${hourKey}</div>
          <input type="text" class="hour-input" placeholder="${dict[currentLang].free}" value="${tasks[dateStr].hours[h] || ''}" oninput="saveTask(${h}, this.value)">
        `;
        list.appendChild(row);
      }
      document.getElementById('dayModal').classList.add('open');
    }

    function saveTask(hour, val) {
      if (!tasks[selectedDateStr]) tasks[selectedDateStr] = { hours: {} };
      tasks[selectedDateStr].hours[hour] = val;
      localStorage.setItem('planner_tasks_v2', JSON.stringify(tasks));
    }

    function closeDayModal() {
      document.getElementById('dayModal').classList.remove('open');
      renderWeek();
    }

    function checkCloseModal(e) {
      if (e.target.id === 'dayModal') closeDayModal();
    }

    function runAiAnalysis() {
      alert(dict[currentLang].aiTip);
    }

    function togglePomodoro() {
      if (!isPomoRunning) {
        isPomoRunning = true;
        pomoInterval = setInterval(() => {
          if (pomoSeconds > 0) {
            pomoSeconds--;
            let m = Math.floor(pomoSeconds / 60);
            let s = pomoSeconds % 60;
            document.getElementById('pomoLabel').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
          } else {
            clearInterval(pomoInterval);
            isPomoRunning = false;
            alert("Час Pomodoro вийшов! Зробіть перерву.");
            pomoSeconds = 1500;
          }
        }, 1000);
      } else {
        clearInterval(pomoInterval);
        isPomoRunning = false;
        document.getElementById('pomoLabel').innerText = "25:00";
        pomoSeconds = 1500;
      }
    }

    renderWeek();
  </script>
</body>
</html>
