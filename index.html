<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <title>Мій Неоновий Планер</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(21, 28, 44, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --accent-cyan: #06b6d4;
      --accent-pink: #ec4899;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; touch-action: manipulation; }
    header { background: rgba(11, 15, 25, 0.95); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 50; }
    h1 { font-size: 1.25rem; font-weight: 700; background: linear-gradient(135deg, #a5b4fc, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 12px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
    .icon-btn:active { transform: scale(0.95); background: rgba(99, 102, 241, 0.2); }
    
    select.lang-select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 7px 10px; border-radius: 10px; font-size: 0.85rem; cursor: pointer; outline: none; }
    
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; background: rgba(15, 23, 42, 0.6); }
    .week-nav { display: flex; align-items: center; gap: 12px; }
    
    .container { padding: 16px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
    .week-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; transition: transform 0.25s ease, opacity 0.25s ease; }
    
    .day-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 14px; cursor: pointer; position: relative; overflow: hidden; display: flex; flex-direction: column; min-height: 140px; }
    .day-card:active { transform: scale(0.97); border-color: var(--primary); }
    .day-card.today { border-color: var(--accent-cyan); box-shadow: 0 0 15px rgba(6, 182, 212, 0.25); }
    .day-name { font-size: 0.85rem; text-transform: uppercase; color: var(--text-sub); font-weight: 700; }
    .day-date { font-size: 1.3rem; font-weight: 700; margin-top: 2px; }
    
    .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: flex-end; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.25s ease; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content { background: #0f172a; border: 1px solid var(--card-border); border-radius: 24px 24px 0 0; width: 100%; max-width: 650px; max-height: 90vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1); }
    .modal.open .modal-content { transform: translateY(0); }
    
    .modal-header { padding: 18px 20px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; position: relative; }
    .swipe-indicator { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; position: absolute; top: 8px; left: 50%; transform: translateX(-50%); }
    
    .hours-scroll { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .hour-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid rgba(255,255,255,0.04); }
    .hour-time { font-size: 0.85rem; font-weight: 700; color: var(--text-sub); width: 50px; }
    
    .btn-ai { background: linear-gradient(135deg, var(--accent-pink), var(--primary)); border: none; color: white; padding: 8px 14px; border-radius: 12px; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    @media (orientation: landscape) and (max-height: 500px) {
      .modal-content { max-height: 98vh; }
      .week-grid { grid-template-columns: repeat(7, 1fr); }
    }
  </style>
</head>
<body>

  <header>
    <h1 id="appTitle">Мій Планер</h1>
    <div class="header-actions">
      <button class="icon-btn" onclick="togglePomodoro()">⏱️ <span id="pomoLabel">25:00</span></button>
      <button class="icon-btn" onclick="toggleMonthPicker()">📅</button>
      <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
        <option value="ua">🇺🇦 UA</option>
        <option value="en">🇬🇧 EN</option>
        <option value="ru">🌐 RU</option>
      </select>
    </div>
  </header>

  <div class="nav-bar">
    <div class="week-nav">
      <button class="icon-btn" onclick="changeWeek(-1)">❮</button>
      <span id="currentWeekRange" style="font-weight:700; font-size:0.9rem;"></span>
      <button class="icon-btn" onclick="changeWeek(1)">❯</button>
    </div>
    <span id="monthYearBadge" style="color:var(--accent-cyan); font-weight:600; font-size:0.85rem;"></span>
  </div>

  <div class="container">
    <div class="week-grid" id="weekGrid"></div>
  </div>

  <!-- Day View Modal -->
  <div class="modal" id="dayModal">
    <div class="modal-content" id="dayModalContent">
      <div class="swipe-indicator"></div>
      <div class="modal-header">
        <div>
          <h2 id="modalDayTitle" style="font-size:1.1rem; font-weight:700;"></h2>
          <p id="modalDaySub" style="font-size:0.8rem; color:var(--text-sub);"></p>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn-ai" onclick="runAiAnalysis()">✨ Поради ШІ</button>
          <button class="icon-btn" onclick="closeDayModal()">✕</button>
        </div>
      </div>
      <div class="hours-scroll" id="hoursList"></div>
    </div>
  </div>

  <script>
    let currentOffset = 0;
    let selectedDate = new Date();
    let tasks = JSON.parse(localStorage.getItem('planner_tasks') || '{}');

    function renderWeek() {
      const grid = document.getElementById('weekGrid');
      grid.innerHTML = '';
      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - now.getDay() + 1 + (currentOffset * 7));

      for (let i = 0; i < 7; i++) {
        const d = new Date(startOfWeek);
        d.setDate(startOfWeek.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const isToday = d.toDateString() === now.toDateString();

        const card = document.createElement('div');
        card.className = `day-card ${isToday ? 'today' : ''}`;
        card.onclick = () => openDayModal(dateStr);
        card.innerHTML = `
          <div class="day-name">${d.toLocaleDateString('uk-UA', { weekday: 'short' })}</div>
          <div class="day-date">${d.getDate()}</div>
          <div style="margin-top:auto; font-size:0.75rem; color:var(--accent-cyan);">
            ${(tasks[dateStr] || []).length} завдань
          </div>
        `;
        grid.appendChild(card);
      }
      document.getElementById('currentWeekRange').innerText = `${startOfWeek.getDate()} - ${new Date(startOfWeek.setDate(startOfWeek.getDate()+6)).getDate()}`;
    }

    function changeWeek(dir) {
      currentOffset += dir;
      renderWeek();
    }

    function openDayModal(dateStr) {
      selectedDate = dateStr;
      document.getElementById('modalDayTitle').innerText = dateStr;
      const list = document.getElementById('hoursList');
      list.innerHTML = '';
      for (let h = 0; h < 24; h++) {
        const hourStr = (h < 10 ? '0' : '') + h + ':00';
        const row = document.createElement('div');
        row.className = 'hour-row';
        row.innerHTML = `<div class="hour-time">${hourStr}</div><div style="font-size:0.85rem; color:var(--text-sub);">Вільний час</div>`;
        list.appendChild(row);
      }
      document.getElementById('dayModal').classList.add('open');
    }

    function closeDayModal() {
      document.getElementById('dayModal').classList.remove('open');
    }

    function runAiAnalysis() {
      alert("✨ Порада ШІ на " + selectedDate + ": Розподіліть завдання рівномірно між ранком та вечором, щоб зберегти енергію!");
    }

    renderWeek();
  </script>
</body>
</html>
